name: Build Artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    uses: doriaxengine/doriax-project-example-ci/.github/workflows/build-project.yml@v1
    with:
      title: Tappy Plane
      subtitle: Tap, click, or press space to keep the plane in the air.
      description: An endless flyer made with Doriax Engine. Tap, click, or press space to keep the plane in the air.
      controls: |
        Flap [Space] [↑] or click / tap
